<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="gradient.css">
</head>
<body>
    <section>
        <h1 style="margin: 10px;">Gradient Generator</h1>
        <h4 style="margin: 10px;">click the below buttons</h4>
        <div id="btn">
            <button id="b1"> #67346 </button>
            <button id="b2"> #74364 </button>
        </div>
        <h2>Click below text to copy the code</h2>
        <div id="copy">
            background-image: linear-gradient(to right, rgb(92, 145, 229), rgb(152, 63, 198));
        </div>
    </section>
    <script>
        let b1=document.getElementById('b1');
        let b2=document.getElementById('b2');
        let copy=document.getElementById('copy');
        let rgb1="rgb(92, 145, 229)";
        let rgb2="rgb(152, 63, 198)";
        let hexcolor=()=>{
            let value="0123456789abcdef";
            let color="#";
            for(let i=0;i<6;i++){
                color=color+value[Math.floor(Math.random()*16)];
            }
            return color;
        }
         let bf1=()=>{
             rgb1=hexcolor();
             b1.innerHTML=rgb1;
            console.log(`button 1 color ${rgb1}`);
            document.body.style.backgroundImage= `linear-gradient(to right,${rgb1}, ${rgb2})`;
            copy.innerHTML=`background-image: linear-gradient(to right,${rgb1},${rgb2});`;
        };
           let bf2=()=>{
             rgb2=hexcolor();
             b2.innerHTML=rgb2;
            console.log(`button 2 color ${rgb2}`);
            document.body.style.backgroundImage= `linear-gradient(to right, ${rgb1},${rgb2})`;
            copy.innerHTML=`background-image:linear-gradient(to right, ${rgb1},${rgb2})`;
        };
        b1.addEventListener("click",bf1);
        b2.addEventListener("click",bf2);
        copy.addEventListener("click",()=>{
            navigator.clipboard.writeText(copy.innerHTML);
            alert("the linear gradiant code has been copied");
        })
    </script>
</body>
</html>
